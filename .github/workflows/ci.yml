name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    container:
      # Ten sam lekki obraz bazowy Pythona co w laboratorium 5.
      image: python:3.11-slim
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Instalacja zależności
        run: python -m pip install -r requirements.txt

      - name: Testy
        run: pytest
